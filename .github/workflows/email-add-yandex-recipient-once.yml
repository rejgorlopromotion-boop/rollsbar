name: Add Yandex Order Recipient Once

on:
  push:
    branches:
      - wordpress/migration-2026-10-01
    paths:
      - .github/workflows/email-add-yandex-recipient-once.yml

permissions:
  contents: read

jobs:
  add-recipient-and-test:
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate staging secrets
        shell: bash
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ISP_MANAGER_URL"
          test -n "$ISP_MANAGER_USER"
          test -n "$ISP_MANAGER_PASSWORD"
          echo "::add-mask::$ISP_MANAGER_USER"
          echo "::add-mask::$ISP_MANAGER_PASSWORD"

      - name: Add second WooCommerce recipient and send one staging test order
        shell: bash
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet paramiko
          python3 - <<'PY'
          import os
          import shlex
          from urllib.parse import urlsplit
          import paramiko

          base = os.environ['ISP_MANAGER_URL'].strip()
          user = os.environ['ISP_MANAGER_USER'].strip()
          password = os.environ['ISP_MANAGER_PASSWORD'].strip()
          host = urlsplit(base).hostname or ''
          if not host:
              raise SystemExit('Could not derive staging host')

          script_name = '.rollsbar-email-recipient-test.php'
          script = r'''<?php
          if ( 'staging' !== wp_get_environment_type() ) {
              fwrite(STDERR, "not_staging\n");
              exit(2);
          }
          if ( ! function_exists('wc_create_order') || ! class_exists('WooCommerce') ) {
              fwrite(STDERR, "woocommerce_missing\n");
              exit(3);
          }

          $recipient = 'tilaninishi12754@gmail.com,rolls.bar.zakaz@yandex.ru';
          $settings = get_option('woocommerce_new_order_settings', array());
          if ( ! is_array($settings) ) { $settings = array(); }
          $settings['enabled'] = 'yes';
          $settings['recipient'] = $recipient;
          update_option('woocommerce_new_order_settings', $settings, false);

          $saved = get_option('woocommerce_new_order_settings', array());
          $saved_recipient = is_array($saved) ? (string)($saved['recipient'] ?? '') : '';
          echo 'saved_recipient=' . $saved_recipient . "\n";
          if ( $saved_recipient !== $recipient ) {
              fwrite(STDERR, "recipient_readback_failed\n");
              exit(4);
          }

          $mail_ok = false;
          $mail_failed = false;
          $mail_to = '';
          $mail_subject = '';
          add_action('wp_mail_succeeded', function($mail_data) use (&$mail_ok, &$mail_to, &$mail_subject) {
              $mail_ok = true;
              $to = $mail_data['to'] ?? '';
              $mail_to = is_array($to) ? implode(',', $to) : (string)$to;
              $mail_subject = (string)($mail_data['subject'] ?? '');
          }, 999, 1);
          add_action('wp_mail_failed', function($error) use (&$mail_failed) {
              $mail_failed = true;
              $message = is_wp_error($error) ? $error->get_error_message() : 'unknown';
              echo 'wp_mail_error=' . preg_replace('/\s+/', ' ', $message) . "\n";
          }, 999, 1);

          $products = wc_get_products(array('status' => 'publish', 'limit' => 1, 'return' => 'objects'));
          if ( empty($products) ) {
              fwrite(STDERR, "no_product\n");
              exit(5);
          }

          $order = wc_create_order();
          if ( is_wp_error($order) ) {
              fwrite(STDERR, "order_create_failed\n");
              exit(6);
          }
          $order->add_product($products[0], 1);
          $order->set_billing_first_name('Тест');
          $order->set_billing_last_name('RollsBar recipients');
          $order->set_billing_email('tilaninishi12754@gmail.com');
          $order->set_billing_phone('+79786882288');
          $order->set_payment_method('cod');
          $order->set_customer_note('ТЕСТ STAGING EMAIL RECIPIENTS — НЕ ГОТОВИТЬ');
          $order->calculate_totals();
          $order->save();
          $order_id = $order->get_id();

          try {
              $emails = WC()->mailer()->get_emails();
              if ( empty($emails['WC_Email_New_Order']) ) {
                  throw new RuntimeException('new_order_email_missing');
              }
              $emails['WC_Email_New_Order']->trigger($order_id, $order);
              echo 'test_order_id=' . $order_id . "\n";
              echo 'wp_mail_succeeded=' . ($mail_ok ? 'yes' : 'no') . "\n";
              echo 'wp_mail_failed=' . ($mail_failed ? 'yes' : 'no') . "\n";
              echo 'mail_to=' . $mail_to . "\n";
              echo 'mail_subject=' . $mail_subject . "\n";
              if ( ! $mail_ok || $mail_failed ) {
                  throw new RuntimeException('send_failed');
              }
              if ( false === stripos($mail_to, 'tilaninishi12754@gmail.com') || false === stripos($mail_to, 'rolls.bar.zakaz@yandex.ru') ) {
                  throw new RuntimeException('both_recipients_not_present');
              }
          } finally {
              $order = wc_get_order($order_id);
              if ( $order ) { $order->delete(true); }
          }
          echo 'temporary_order_cleanup=' . (wc_get_order($order_id) ? 'fail' : 'pass') . "\n";
          echo "DUAL RECIPIENT STAGING SEND PASS\n";
          ?>'''

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          client.connect(
              hostname=host, port=22, username=user, password=password,
              timeout=15, auth_timeout=15, banner_timeout=15,
              look_for_keys=False, allow_agent=False,
          )
          try:
              sftp = client.open_sftp()
              try:
                  with sftp.open(script_name, 'w') as fh:
                      fh.write(script.encode('utf-8'))
                  sftp.chmod(script_name, 0o600)
              finally:
                  sftp.close()

              remote = f'''set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          WP_PATH="$HOME/www/staging.rollsbar.ru"
          [[ "$(wp --path="$WP_PATH" eval 'echo wp_get_environment_type();')" == "staging" ]]
          [[ "$(wp --path="$WP_PATH" plugin get rollsbar-core --field=status)" == "active" ]]
          wp --path="$WP_PATH" eval-file "$HOME/{script_name}"
          '''
              _, stdout, stderr = client.exec_command('bash -lc ' + shlex.quote(remote), timeout=300)
              out = stdout.read().decode('utf-8', errors='replace').strip()
              err = stderr.read().decode('utf-8', errors='replace').strip()
              code = stdout.channel.recv_exit_status()
              if out:
                  print(out)
              if code != 0:
                  if err:
                      print('staging_test_stderr=' + ' | '.join(err.splitlines())[-2000:])
                  raise SystemExit(code)
              if 'DUAL RECIPIENT STAGING SEND PASS' not in out or 'temporary_order_cleanup=pass' not in out:
                  raise SystemExit('Dual recipient proof incomplete')
          finally:
              try:
                  sftp = client.open_sftp()
                  try:
                      try:
                          sftp.remove(script_name)
                      except FileNotFoundError:
                          pass
                  finally:
                      sftp.close()
              except Exception:
                  pass
              client.close()
          PY
